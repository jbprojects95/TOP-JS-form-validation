<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Form Validation</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>

  <!-- 
    Build a browser form which collects Email, Country, Postal Code, Password and Password Confirmation fields. 
    It should use live inline validation to inform the user whether a field is properly filled in or not. 
    That means validating as you type, not only upon form submission. 
    When a field is invalid, it should be highlighted in red and show an error message to guide the user.
    
    you should give an error message if the button is pushed with any active errors or unfilled required fields. 
    For the sake of this lesson, make sure the <form> element has the novalidate attribute which will allow you to do all of your validation in your JavaScript files. 
    You can still use different <input> types, but you will need to use JavaScript to check and report their validity. 
    If all is well and the form is “submitted”, give the user a high five.
    -->

  <body>
    <header>
      <h1>Js Form Validation</h1>
    </header>

    <main class="main-layout">
      <section class="hero">
        <div class="main-grid-cell info-section">
          <h2>Info cell</h2>
          <p>
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. Tempora,
            et, rerum sed, quibusdam natus voluptas quas excepturi accusantium
            molestias provident temporibus placeat officia illum quae aliquam
            quo aut sapiente reiciendis.
          </p>
        </div>
        <div class="main-grid-cell form-section">
          <div class="form-header">
            <h2>Sign up below:</h2>
          </div>
          <form
            action=""
            method="get"
            class="sign-up-form"
            id="signUpForm"
            novalidate
          >
            <div class="form-row">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="johndoe@example.com"
                aria-describedby="emailErrorField"
                required
              />
              <span class="error-field" id="emailErrorField"></span>
            </div>

            <div class="form-row">
              <label for="country">Country</label>
              <input
                type="text"
                id="country"
                name="country"
                placeholder="Country"
                aria-describedby="countryErrorField"
                required
              />
              <span class="error-field" id="countryErrorField"></span>
            </div>

            <div class="form-row">
              <label for="postcode">Postcode</label>
              <input
                name="postcode"
                id="postcode"
                type="text"
                pattern="([a-zA-Z]{1,2}\d{1,2}[a-zA-Z]? ?\d[a-zA-Z]{2}|GIR ?0AA)"
                title="Enter a valid UK postcode."
                placeholder="Enter your postcode"
                aria-describedby="postcodeErrorField"
                required
              />
              <span class="error-field" id="postcodeErrorField"></span>
            </div>

            <div class="form-row">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                aria-describedby="passwordErrorField"
                required
              />
              <span class="error-field" id="passwordErrorField"></span>
            </div>

            <div class="form-row">
              <label for="confirmPassword">Confirm Password</label>
              <input
                type="password"
                placeholder="Confirm Password"
                id="confirmPassword"
                name="confirmPassword"
                aria-describedby="confirmPasswordErrorField"
                required
              />
              <span class="error-field" id="confirmPasswordErrorField"></span>
            </div>

            <div class="form-row">
              <button type="submit">Sign Up</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <h3>JBPROJECTS95</h3>
    </footer>
  </body>
</html>
